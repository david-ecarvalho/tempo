<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo Continuum — Home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&amp;display=swap">
<style>
body{margin:0;font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-weight:500}
h1,h2,h3,h4,p{font-weight:500}
a{color:inherit}a:hover{text-decoration-thickness:2px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width: 760px){
.tc-header-row{flex-wrap:nowrap !important;gap:8px !important;padding:10px 16px !important}
.tc-nav,.tc-buscar{display:none !important}
.tc-logo{margin-right:auto;min-width:0}
.tc-tema-txt{display:none}
.tc-tema{padding:8px 12px !important}
.tc-chips{flex-wrap:nowrap !important;overflow-x:auto;padding-bottom:8px;margin-right:-16px;padding-right:16px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tc-chips>*{flex:none}
main{padding-left:16px !important;padding-right:16px !important;gap:32px !important}
footer>div{padding-left:16px !important;padding-right:16px !important}
}

/* Cabeçalho fixo e menu lateral */
.tc-topo{position:sticky;top:0;z-index:50}
.tc-menu-btn{display:flex !important}
.tc-painel{display:block !important;position:fixed;top:0;left:0;bottom:0;width:min(340px,86vw);overflow-y:auto;z-index:70;box-shadow:8px 0 32px rgba(16,16,16,.35);padding:12px 16px 24px !important;border-top:0 !important;box-sizing:border-box}
.tc-fundo{position:fixed;inset:0;z-index:60;background:rgba(16,16,16,.45);border:0;padding:0;cursor:pointer}
.tc-painel-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.tc-painel-topo button{font:inherit;font-size:14px;letter-spacing:0;text-transform:none;background:none;border:2px solid currentColor;color:inherit;border-radius:999px;padding:6px 14px;cursor:pointer}
/* Cabeçalho em uma linha só: ocupa a largura toda da janela */
.tc-header-row{max-width:none !important;flex-wrap:nowrap !important;gap:12px 20px !important}
.tc-nav{flex-wrap:nowrap !important;flex:1 1 auto !important;min-width:0}
.tc-nav a{white-space:nowrap}
@media (max-width: 1320px){.tc-nav{gap:2px !important}.tc-nav a{padding:8px 10px !important}.tc-buscar,.tc-menu-btn{font-size:0 !important;gap:0 !important;padding:8px 13px !important}.tc-tema-txt{display:none}.tc-tema{padding:8px 13px !important}}
@media (max-width: 1100px){.tc-nav,.tc-buscar{display:none !important}.tc-logo{margin-right:auto;min-width:0}}
</style>
<style>html,body{margin:0} #app > div{min-height:100vh}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="background: {{c.bg}}; color: {{c.ink}}; min-height: 100%; font-family: &quot;Montserrat&quot;, Arial, sans-serif; font-weight: 500;">

  <header class="tc-topo" style="background: {{c.bg}}; color: {{c.ink}}; border-bottom: 2px solid {{c.ink}};">
    <div class="tc-header-row" style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 40px;">
      <button type="button" class="tc-menu-btn" onClick="{{alternarMenu}}" aria-expanded="{{menuAbertoTxt}}" aria-controls="tc-painel" style="align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: transparent; color: {{c.ink}}; border-radius: 999px; padding: 8px 14px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{menuFechado}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></sc-if>
        <sc-if value="{{menuAberto}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
        Menu
      </button>
      <a class="tc-logo" href="index.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;" aria-label="Tempo Continuum, início">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><img src="logos/logo-claro.svg" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if><sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><img src="logos/logo-escuro.svg" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if>
        <span style="font-size: 13px; line-height: 1.05; letter-spacing: 0.08em; text-transform: uppercase;">Tempo<br>Continuum</span>
      </a>
      <nav class="tc-nav" aria-label="Seções" style="display: flex; flex-wrap: wrap; gap: 6px 8px; flex: 1 1 560px; font-size: 15px;">
        <a href="noticias.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Notícias</a>
        <a href="streaming.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Streaming</a>
        <a href="ferramentas.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Recursos</a>
        <a href="cursos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Academia</a>
        <a href="politicos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Wiki</a>
        <a href="dossies.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Dossiês</a>
        <a href="publicacoes.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Publicações</a>
      </nav>
      <a class="tc-buscar" href="noticias.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; border: 2px solid {{c.ink}}; border-radius: 999px; padding: 8px 16px; font-size: 14px; min-height: 44px; box-sizing: border-box;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        Buscar
      </a>
      <button type="button" class="tc-tema" onClick="{{alternarTema}}" aria-label="{{temaLabel}}" style="display: flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: {{c.ink}}; color: {{c.bg}}; border-radius: 999px; padding: 8px 16px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
        <sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
        <span class="tc-tema-txt">{{temaTexto}}</span>
      </button>
    </div>
    <sc-if value="{{menuAberto}}" hint-placeholder-val="{{false}}">
      <button type="button" class="tc-fundo" onClick="{{fecharMenu}}" aria-label="Fechar o menu" tabindex="-1"></button>
      <nav id="tc-painel" class="tc-painel" aria-label="Menu" style="background: {{c.bg}}; color: {{c.ink}}; border-right: 2px solid {{c.ink}};">
        <div class="tc-painel-topo"><span>Tempo Continuum</span><button type="button" onClick="{{fecharMenu}}">Fechar</button></div>
        <a href="index.html" aria-current="page" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}}; background: #556A2F; color: #FFFAF0;">Início</a>
        <a href="noticias.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Notícias</a>
        <a href="streaming.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Streaming</a>
        <a href="ferramentas.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Recursos</a>
        <a href="cursos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Academia</a>
        <a href="politicos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Wiki</a>
        <a href="dossies.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Dossiês</a>
        <a href="publicacoes.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Publicações</a>
        <a href="noticias.html" onClick="{{fecharMenu}}" style="text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 14px 12px; font-size: 18px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar</a>
      </nav>
    </sc-if>
  </header>

  <main id="topo" style="max-width: 1240px; margin: 0 auto; padding: 40px 24px 80px; display: flex; flex-direction: column; gap: 80px;">

    <section aria-label="Destaques" style="display: flex; flex-wrap: wrap; gap: 40px;">
      <article style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
        <sc-if value="{{principal.temFoto}}" hint-placeholder-val="{{false}}"><a href="{{principal.link}}" tabindex="-1" aria-hidden="true" style="display: block;"><img src="{{principal.foto}}" referrerpolicy="no-referrer" alt="" style="display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border: 1px solid {{c.line}}; box-sizing: border-box;"></a></sc-if>
        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;">
          <span style="background: #556A2F; color: #FFFAF0; padding: 3px 10px;">{{principal.editoria}}</span>
          <span style="color: {{c.muted}};">{{principal.dataTexto}}</span>
        </div>
        <h1 style="margin: 0; font-size: clamp(2rem, 4.2vw, 3.4rem); line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance;"><a href="{{principal.link}}" style="text-decoration: none;">{{principal.titulo}}</a></h1>
        <p style="margin: 0; font-size: 1.15rem; line-height: 1.55; color: {{c.muted}}; max-width: 62ch;">{{principal.linha}}</p>
      </article>

      <aside style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 0;">
        <sc-if value="{{temDestaques}}" hint-placeholder-val="{{true}}">
          <p style="margin: 0 0 4px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}};">Também em destaque</p>
          <sc-for list="{{destaques}}" as="d" hint-placeholder-count="3">
            <article style="border-top: 1px solid {{c.line}}; padding: 16px 0; display: flex; flex-direction: column; gap: 8px;">
              <span style="font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}};">{{d.editoria}} · {{d.dataTexto}}</span>
              <h3 style="margin: 0; font-size: 1.2rem; line-height: 1.25;"><a href="{{d.link}}" style="text-decoration: none;">{{d.titulo}}</a></h3>
            </article>
          </sc-for>
        </sc-if>

        <form id="busca" onSubmit="{{enviarBusca}}" style="margin-top: 12px; background: {{c.surface}}; color: {{c.ink}}; border: 2px solid {{c.ink}}; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
          <label for="q" style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;">Pesquise o acervo</label>
          <div style="display: flex; gap: 8px;">
            <input id="q" type="search" value="{{busca}}" onChange="{{onBusca}}" placeholder="Palavra, nome ou tag" autocomplete="off" style="flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 10px 12px; border: 2px solid {{c.ink}}; background: {{c.bg}}; color: {{c.ink}}; border-radius: 0;">
            <a href="noticias.html" onClick="{{buscar}}" style="display: flex; align-items: center; text-decoration: none; font-size: 14px; padding: 10px 16px; background: #556A2F; color: #FFFAF0; min-height: 44px; box-sizing: border-box;">Buscar</a>
          </div>
          <sc-if value="{{temTags}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px;">
              <sc-for list="{{tags}}" as="t" hint-placeholder-count="4">
                <a href="noticias.html" onClick="{{t.ir}}" style="text-decoration: none; border: 1.5px solid {{c.ink}}; padding: 4px 10px; border-radius: 999px;">{{t.nome}}</a>
              </sc-for>
            </div>
          </sc-if>
        </form>
      </aside>
    </section>

    <sc-if value="{{temUltimas}}" hint-placeholder-val="{{true}}">
    <section id="noticias" aria-labelledby="h-noticias" style="display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 2px solid {{c.ink}}; padding-top: 16px;">
        <h2 id="h-noticias" style="margin: 0; font-size: 2rem; letter-spacing: -0.01em;"><span style="background: #556A2F; color: #FFFAF0; padding: 0 8px;">Notícias</span></h2>
        <a href="noticias.html" style="font-size: 14px; text-underline-offset: 4px;">Todas as notícias</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 32px 28px;">
        <sc-for list="{{ultimas}}" as="n" hint-placeholder-count="4">
          <article style="display: flex; flex-direction: column; gap: 10px;">
            <sc-if value="{{n.temFoto}}" hint-placeholder-val="{{false}}"><a href="{{n.link}}" tabindex="-1" aria-hidden="true" style="display: block;"><img src="{{n.foto}}" referrerpolicy="no-referrer" alt="" loading="lazy" style="display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border: 1px solid {{c.line}}; box-sizing: border-box;"></a></sc-if>
            <sc-if value="{{n.semFoto}}" hint-placeholder-val="{{true}}"><div style="aspect-ratio: 3 / 2; background: {{c.surface}}; border: 1px solid {{c.line}};"></div></sc-if>
            <span style="font-size: 12px; color: {{c.muted}};">{{n.dataTexto}} · {{n.tagPrincipal}}</span>
            <h3 style="margin: 0; font-size: 1.15rem; line-height: 1.3;"><a href="{{n.link}}" style="text-decoration: none;">{{n.titulo}}</a></h3>
            <p style="margin: 0; font-size: 0.92rem; line-height: 1.55; color: {{c.muted}};">{{n.linha}}</p>
          </article>
        </sc-for>
      </div>
    </section>
    </sc-if>

    <sc-if value="{{temVideos}}" hint-placeholder-val="{{true}}">
    <section id="streaming" aria-labelledby="h-streaming" style="display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 2px solid {{c.ink}}; padding-top: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <h2 id="h-streaming" style="margin: 0; font-size: 2rem; letter-spacing: -0.01em;"><span style="background: #556A2F; color: #FFFAF0; padding: 0 8px;">Streaming</span></h2>
          <p style="margin: 0; font-size: 0.95rem; color: {{c.muted}};">Documentários e vídeos do YouTube sobre história, trabalho e luta política.</p>
        </div>
        <a href="streaming.html" style="font-size: 14px; text-underline-offset: 4px;">Ver tudo em Streaming</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px;">
        <sc-for list="{{videos}}" as="v" hint-placeholder-count="4">
          <article style="display: flex; flex-direction: column; gap: 10px;">
            <a href="{{v.link}}" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-hidden="true" style="position: relative; display: block; aspect-ratio: 16 / 9; background: #101010; overflow: hidden;">
              <sc-if value="{{v.temCapa}}" hint-placeholder-val="{{true}}"><img src="{{v.capa}}" referrerpolicy="no-referrer" alt="" loading="lazy" style="display: block; width: 100%; height: 100%; object-fit: cover;"></sc-if>
              <span style="position: absolute; right: 10px; bottom: 10px; width: 44px; height: 44px; border-radius: 50%; background: #556A2F; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFAF0" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span>
            </a>
            <h3 style="margin: 0; font-size: 1.05rem; line-height: 1.3;"><a href="{{v.link}}" target="_blank" rel="noopener noreferrer" style="text-decoration: none;">{{v.titulo}}</a></h3>
            <span style="font-size: 13px; color: {{c.muted}};">{{v.criador}}</span>
          </article>
        </sc-for>
      </div>
    </section>
    </sc-if>

    <section id="recursos" aria-labelledby="h-recursos" style="display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 2px solid {{c.ink}}; padding-top: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <h2 id="h-recursos" style="margin: 0; font-size: 2rem; letter-spacing: -0.01em;"><span style="background: #556A2F; color: #FFFAF0; padding: 0 8px;">Recursos</span></h2>
          <p style="margin: 0; font-size: 0.95rem; color: {{c.muted}};">Ferramentas para fiscalizar o poder público, participar e comunicar.</p>
        </div>
        <a href="ferramentas.html" style="font-size: 14px; text-underline-offset: 4px;">Todas as ferramentas</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px;">
        <sc-for list="{{ferramentas}}" as="f" hint-placeholder-count="4">
          <article style="background: {{c.surface}}; border: 1px solid {{c.line}}; padding: 22px; display: flex; flex-direction: column; gap: 10px;">
            <span style="font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.muted}};">{{f.categoria}}</span>
            <h3 style="margin: 0; font-size: 1.2rem; line-height: 1.2;">{{f.nome}}</h3>
            <p style="margin: 0; font-size: 0.9rem; line-height: 1.5; color: {{c.muted}};">{{f.descricao}}</p>
            <a href="{{f.link}}" style="margin-top: auto; align-self: flex-start; text-decoration: none; background: #556A2F; color: #FFFAF0; padding: 10px 16px; font-size: 14px;">Abrir</a>
          </article>
        </sc-for>
      </div>
      <sc-if value="{{temCurtos}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 14px;">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px;">
            <h3 style="margin: 0; font-size: 1.3rem;">Vídeos curtos recentes</h3>
            <a href="curtos.html" style="font-size: 14px; text-underline-offset: 4px;">Todos os vídeos curtos</a>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
            <sc-for list="{{curtos}}" as="v" hint-placeholder-count="4">
              <a href="{{v.endereco}}" style="text-decoration: none; border: 1px solid {{c.line}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;">
                <span style="align-self: flex-start; background: #101010; color: #FFFAF0; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px;">{{v.plataforma}}</span>
                <span style="font-size: 1rem; line-height: 1.3;">{{v.titulo}}</span>
                <span style="font-size: 12px; color: {{c.muted}};">{{v.tags}}</span>
              </a>
            </sc-for>
          </div>
        </div>
      </sc-if>
    </section>

    <section id="cursos" aria-labelledby="h-cursos" style="display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 2px solid {{c.ink}}; padding-top: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <h2 id="h-cursos" style="margin: 0; font-size: 2rem; letter-spacing: -0.01em;"><span style="background: #556A2F; color: #FFFAF0; padding: 0 8px;">Academia</span></h2>
          <p style="margin: 0; font-size: 0.95rem; color: {{c.muted}};">Cursos em módulos, para estudar no seu ritmo ou em grupo, e escolas públicas online gratuitas.</p>
        </div>
        <a href="cursos.html" style="font-size: 14px; text-underline-offset: 4px;">Todos os cursos</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px;">
        <sc-for list="{{cursos}}" as="k" hint-placeholder-count="3">
          <article style="border: 2px solid {{c.ink}}; padding: 22px; display: flex; flex-direction: column; gap: 12px;">
            <span style="font-size: 12px; color: {{c.muted}};">{{k.meta}}</span>
            <h3 style="margin: 0; font-size: 1.25rem; line-height: 1.2;">{{k.nome}}</h3>
            <p style="margin: 0; font-size: 0.9rem; line-height: 1.5; color: {{c.muted}};">{{k.descricao}}</p>
            <a href="{{k.link}}" style="margin-top: auto; text-decoration: none; align-self: flex-start; background: #556A2F; color: #FFFAF0; padding: 10px 16px; font-size: 14px;">Ver curso</a>
          </article>
        </sc-for>
      </div>
    </section>

    <sc-if value="{{temPerfis}}" hint-placeholder-val="{{true}}">

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { escuro: null };
  }
  componentDidMount() {
    var eu = this;
    // Cada seção lê o seu índice em dados/; enquanto um índice não chega (ou se faltar), a seção fica escondida
    [['noticias', 'remoto'], ['videos', 'videos'], ['curtos', 'curtos'], ['dossies', 'dossies'], ['politicos', 'politicos'], ['publicacoes', 'publicacoes']].forEach(function (x) {
      try {
        fetch('dados/' + x[0] + '.json', { cache: 'no-cache' })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(function (dados) { var p = {}; p[x[1]] = dados; eu.setState(p); })
          .catch(function () {});
      } catch (e) {}
    });
    try {
      var v = window.localStorage.getItem('tc-tema');
      if (v === 'escuro' || v === 'claro') this.setState({ escuro: v === 'escuro' });
    } catch (e) {}
  }
  // Os cursos da Academia (os mesmos de cursos.html)
  cursos() {
    return [
      { nome: 'Marxismo', meta: '9 módulos · leitura online', link: 'curso-marxismo.html',
        descricao: 'Uma introdução às ideias de Marx e Engels: o método materialista, as classes sociais, o capitalismo, o Estado e a revolução, e como o marxismo pensou o Brasil.' },
      { nome: 'Como construir o movimento estudantil na sua cidade', meta: '7 módulos · leitura online', link: 'curso-movimento-estudantil.html',
        descricao: 'Do grêmio da escola à entidade municipal: como fundar ou reativar uma UMES, a lei que protege a organização estudantil e a relação com a UBES e a UNE.' },
      { nome: 'Musculação gastando o mínimo', meta: '8 módulos · leitura online', link: 'curso-musculacao.html',
        descricao: 'Força e massa muscular com o peso do corpo, uma mochila e no máximo R$ 150 em equipamento: exercícios, programas prontos e alimentação barata.' }
    ];
  }
  // Ferramentas em destaque (a lista completa fica em ferramentas.html)
  ferramentas() {
    return [
      { nome: 'Votações no e-Cidadania', categoria: 'Participação', link: 'votacoes.html', descricao: 'Consultas públicas do Senado explicadas, com a nossa recomendação de voto e o link para votar.' },
      { nome: 'Contatos de parlamentares', categoria: 'Participação', link: 'contatos.html', descricao: 'E-mail, telefone e redes de deputados e senadores, com filtro por casa, estado e partido.' },
      { nome: 'Repositório de Vídeos Curtos', categoria: 'Comunicação', link: 'curtos.html', descricao: 'Vídeos curtos de várias plataformas, organizados por tags.' },
      { nome: 'Acompanhamento de casos', categoria: 'Fiscalização', link: 'politicos.html#casos', descricao: 'Investigações acompanhadas do início ao fim, com situação, envolvidos, etapas e documentos.' }
    ];
  }
  renderVals() {
    var st = this.state || {};
    var escuro = (st.escuro !== null && st.escuro !== undefined) ? st.escuro : (this.props.tema ?? 'claro') === 'escuro';
    var self = this;
    var c = escuro
      ? { bg: '#101010', surface: '#2F2E25', ink: '#FFFAF0', muted: '#DDD5CA', line: 'rgba(221, 213, 202, 0.3)' }
      : { bg: '#FFFAF0', surface: '#DDD5CA', ink: '#101010', muted: '#2F2E25', line: 'rgba(47, 46, 37, 0.28)' };
    var lista = function (v) { return Array.isArray(v) ? v : []; };
    var guardar = function (chave, valor) { try { if (valor) window.localStorage.setItem(chave, valor); } catch (e) {} };
    var meses = ['jan.', 'fev.', 'mar.', 'abr.', 'maio', 'jun.', 'jul.', 'ago.', 'set.', 'out.', 'nov.', 'dez.'];
    var fmtData = function (iso) { var p = String(iso || '').slice(0, 10).split('-'); return p.length === 3 ? Number(p[2]) + ' ' + meses[Number(p[1]) - 1] + ' ' + p[0] : ''; };
    var porData = function (x, y) { return String(x.data || '') < String(y.data || '') ? 1 : -1; };

    // Notícias: manchete (a mais recente marcada como destaque), mais 3 em destaque e as 4 seguintes
    var materias = lista(st.remoto).slice().sort(porData);
    var noticias = materias.map(function (n) {
      return { titulo: n.titulo, linha: n.linha || '', editoria: n.editoria || 'Notícia', dataTexto: fmtData(n.data), tagPrincipal: (n.tags || [])[0] ? TCTags.rotulo(n.tags[0]) : (n.editoria || '').toLowerCase(),
        link: 'materia.html?id=' + encodeURIComponent(n.id), foto: n.foto || '', temFoto: !!n.foto, semFoto: !n.foto, destaque: !!n.destaque };
    });
    var iPrincipal = Math.max(0, noticias.findIndex(function (n) { return n.destaque; }));
    var principal = noticias[iPrincipal] || { titulo: st.remoto ? 'Nenhuma matéria publicada ainda' : 'Carregando…', linha: '', editoria: 'Notícias', dataTexto: '', link: 'noticias.html', temFoto: false };
    var resto = noticias.filter(function (n, i) { return i !== iPrincipal; });
    // Tags mais usadas nas matérias, para atalhos da busca
    var tags = TCTags.contar(materias.map(function (n) { return n.tags || []; })).filter(function (t) { return !t.sub; }).slice(0, 5).map(function (t) {
      return { nome: t.rotulo, ir: function () { guardar('tc-busca-tag', t.tag); } };
    });

    // Streaming: os 4 vídeos do YouTube mais recentes
    var videos = lista(st.videos).slice().sort(porData).slice(0, 4).map(function (v) {
      return { titulo: v.titulo, criador: v.criador || '', link: v.link, capa: v.capa || '', temCapa: !!v.capa };
    });

    // Vídeos curtos: os 4 mais recentes (só aparecem quando houver algum)
    var curtos = lista(st.curtos).slice().sort(porData).slice(0, 4).map(function (v) {
      return { titulo: v.titulo, plataforma: v.plataforma || 'Vídeo', endereco: 'curtos.html#' + encodeURIComponent(v.id),
        tags: (v.tags || []).slice(0, 3).map(TCTags.rotulo).join(' · ') };
    });

    // Dossiês: o marcado como destaque (ou o mais recente) em evidência, mais 3
    var nCap = function (d) { var n = lista(d.capitulos).length; return n + (n === 1 ? ' capítulo' : ' capítulos'); };
    var dossies = lista(st.dossies).slice().sort(porData).map(function (d) {
      return { titulo: d.titulo, linha: d.linha || '', temLinha: !!d.linha, capitulosTexto: nCap(d), link: 'dossie.html?id=' + encodeURIComponent(d.id), destaque: !!d.destaque };
    });
    var iDossie = Math.max(0, dossies.findIndex(function (d) { return d.destaque; }));
    var outrosDossies = dossies.filter(function (d, i) { return i !== iDossie; }).slice(0, 3);

    // Wiki: até 4 fichas
    var perfis = lista(st.politicos).slice(0, 4).map(function (p) {
      return { nome: p.nome, iniciais: p.iniciais || String(p.nome || '').split(/\s+/).map(function (x) { return x[0] || ''; }).join('').slice(0, 2).toUpperCase(),
        foto: p.foto || '', temFoto: !!p.foto, semFoto: !p.foto,
        detalhe: [p.cargo_curto || p.categoria, p.partido, p.uf].filter(Boolean).join(' · '),
        chamada: p.chamada || '', temChamada: !!p.chamada, link: 'ficha.html?id=' + encodeURIComponent(p.id) };
    });

    // Publicações: os 4 livros e revistas mais recentes (só aparecem quando houver algum)
    var pubs = st.publicacoes || {};
    var publicacoes = lista(pubs.livros).map(function (p) { return Object.assign({ grupo: 'livros', tipo: 'Livro' }, p); })
      .concat(lista(pubs.revistas).map(function (p) { return Object.assign({ grupo: 'revistas', tipo: 'Revista' }, p); }))
      .sort(function (x, y) { return String(x.data || x.ano || '') < String(y.data || y.ano || '') ? 1 : -1; }).slice(0, 4)
      .map(function (p) { return { titulo: p.titulo, tipo: p.tipo, capa: p.capa || '', temCapa: !!p.capa, semCapa: !p.capa, endereco: 'publicacoes.html#' + p.grupo }; });

    return {
      principal: principal, destaques: resto.slice(0, 3), temDestaques: resto.length > 0,
      ultimas: resto.slice(3, 7), temUltimas: resto.length > 3,
      tags: tags, temTags: tags.length > 0,
      videos: videos, temVideos: videos.length > 0,
      curtos: curtos, temCurtos: curtos.length > 0,
      ferramentas: this.ferramentas(), cursos: this.cursos(),
      dossie: dossies[iDossie] || {}, temDossies: dossies.length > 0, outrosDossies: outrosDossies, temOutrosDossies: outrosDossies.length > 0,
      perfis: perfis, temPerfis: perfis.length > 0,
      publicacoes: publicacoes, temPublicacoes: publicacoes.length > 0,
      menuAberto: !!st.menuAberto,
      menuFechado: !st.menuAberto,
      menuAbertoTxt: st.menuAberto ? 'true' : 'false',
      alternarMenu: function () { self.setState({ menuAberto: !self.state.menuAberto }); },
      fecharMenu: function () { self.setState({ menuAberto: false }); },
      busca: st.busca || '',
      onBusca: function (e) { self.setState({ busca: e.target.value }); },
      buscar: function () { guardar('tc-busca-q', (self.state.busca || '').trim()); },
      enviarBusca: function (e) { e.preventDefault(); guardar('tc-busca-q', (self.state.busca || '').trim()); window.location.href = 'noticias.html'; },
      c: c,
      escuro: escuro,
      claro: !escuro,
      temaTexto: escuro ? 'Claro' : 'Escuro',
      temaLabel: escuro ? 'Mudar para o tema claro' : 'Mudar para o tema escuro',
      alternarTema: function () {
        var novo = !escuro;
        self.setState({ escuro: novo });
        try { window.localStorage.setItem('tc-tema', novo ? 'escuro' : 'claro'); } catch (e) {}
      }
    };
  }
}
iniciarPagina(Component, {"tema": "claro"});
</script>
