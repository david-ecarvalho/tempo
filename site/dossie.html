<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo Continuum — Dossiê</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&amp;display=swap">
<style>
body{margin:0;font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-weight:500}
h1,h2,h3,h4,p{font-weight:500}
a{color:inherit}a:hover{text-decoration-thickness:2px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width: 760px){
.tc-header-row{flex-wrap:nowrap !important;gap:8px !important;padding:10px 16px !important}
.tc-nav,.tc-buscar{display:none !important}
.tc-logo{margin-right:auto;min-width:0}
.tc-tema-txt{display:none}
.tc-tema{padding:8px 12px !important}
.tc-chips{flex-wrap:nowrap !important;overflow-x:auto;padding-bottom:8px;margin-right:-16px;padding-right:16px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tc-chips>*{flex:none}
main{padding-left:16px !important;padding-right:16px !important;gap:32px !important}
footer>div{padding-left:16px !important;padding-right:16px !important}
}

/* Cabeçalho fixo e menu lateral */
.tc-topo{position:sticky;top:0;z-index:50}
.tc-menu-btn{display:flex !important}
.tc-painel{display:block !important;position:fixed;top:0;left:0;bottom:0;width:min(340px,86vw);overflow-y:auto;z-index:70;box-shadow:8px 0 32px rgba(16,16,16,.35);padding:12px 16px 24px !important;border-top:0 !important;box-sizing:border-box}
.tc-fundo{position:fixed;inset:0;z-index:60;background:rgba(16,16,16,.45);border:0;padding:0;cursor:pointer}
.tc-painel-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.tc-painel-topo button{font:inherit;font-size:14px;letter-spacing:0;text-transform:none;background:none;border:2px solid currentColor;color:inherit;border-radius:999px;padding:6px 14px;cursor:pointer}
/* Cabeçalho em uma linha só: ocupa a largura toda da janela */
.tc-header-row{max-width:none !important;flex-wrap:nowrap !important;gap:12px 20px !important}
.tc-nav{flex-wrap:nowrap !important;flex:1 1 auto !important;min-width:0}
.tc-nav a{white-space:nowrap}
@media (max-width: 1320px){.tc-nav{gap:2px !important}.tc-nav a{padding:8px 10px !important}.tc-buscar,.tc-menu-btn{font-size:0 !important;gap:0 !important;padding:8px 13px !important}.tc-tema-txt{display:none}.tc-tema{padding:8px 13px !important}}
@media (max-width: 1100px){.tc-nav,.tc-buscar{display:none !important}.tc-logo{margin-right:auto;min-width:0}}
</style>
<style>html,body{margin:0} #app > div{min-height:100vh}</style>
<style>
/* Só na tela / só no papel */
.tc-so-pdf{display:none}
.tc-sumario a{text-decoration:none}
.tc-sumario a:hover{text-decoration:underline;text-underline-offset:3px}
@page{size:A4;margin:20mm 18mm 22mm}
@page{@bottom-left{content:"Tempo Continuum · Dossiê";font-family:Montserrat,Arial,sans-serif;font-size:8.5pt;color:#2F2E25}@bottom-right{content:counter(page);font-family:Montserrat,Arial,sans-serif;font-size:8.5pt;color:#2F2E25}}
@page :first{@bottom-left{content:none}@bottom-right{content:none}}
@media print{
  html,body,#app>div{background:#fff !important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tc-topo,footer,.tc-nao-imprimir{display:none !important}
  .tc-so-pdf{display:flex !important}
  main{max-width:none !important;padding:0 !important;gap:0 !important}
  .tc-capa-pdf{break-after:page;min-height:247mm;box-sizing:border-box}
  .tc-sumario{border:0 !important;padding:0 0 18pt !important;margin-bottom:18pt}
  .tc-sumario ol{font-size:12pt !important}
  .tc-capitulo,.tc-parte{break-before:page}
  .tc-parte{min-height:200mm;justify-content:center}
  .tc-texto{font-size:11pt !important;line-height:1.6 !important;gap:10pt !important}
  h1,h2,h3{break-after:avoid}
  figure,img,blockquote,li{break-inside:avoid}
  p{orphans:3;widows:3}
  a{color:inherit !important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="background: {{c.bg}}; color: {{c.ink}}; min-height: 100%; font-family: &quot;Montserrat&quot;, Arial, sans-serif; font-weight: 500;">

  <header class="tc-topo" style="background: {{c.bg}}; color: {{c.ink}}; border-bottom: 2px solid {{c.ink}};">
    <div class="tc-header-row" style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 40px;">
      <button type="button" class="tc-menu-btn" onClick="{{alternarMenu}}" aria-expanded="{{menuAbertoTxt}}" aria-controls="tc-painel" style="align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: transparent; color: {{c.ink}}; border-radius: 999px; padding: 8px 14px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{menuFechado}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></sc-if>
        <sc-if value="{{menuAberto}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
        Menu
      </button>
      <a class="tc-logo" href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;" aria-label="Tempo Continuum, início">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><img src="logos/logo-claro.svg" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if><sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><img src="logos/logo-escuro.svg" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if>
        <span style="font-size: 13px; line-height: 1.05; letter-spacing: 0.08em; text-transform: uppercase;">Tempo<br>Continuum</span>
      </a>
      <nav class="tc-nav" aria-label="Seções" style="display: flex; flex-wrap: wrap; gap: 6px 8px; flex: 1 1 560px; font-size: 15px;">
        <a href="noticias.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Notícias</a>
        <a href="streaming.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Streaming</a>
        <a href="ferramentas.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Recursos</a>
        <a href="cursos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Academia</a>
        <a href="politicos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Wiki</a>
        <a href="dossies.html" aria-current="page" style="text-decoration: none; padding: 8px 14px; border-radius: 999px; background: #556A2F; color: #FFFAF0;">Dossiês</a>
        <a href="publicacoes.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Publicações</a>
      </nav>
      <a class="tc-buscar" href="noticias.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; border: 2px solid {{c.ink}}; border-radius: 999px; padding: 8px 16px; font-size: 14px; min-height: 44px; box-sizing: border-box;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar</a>
      <button type="button" class="tc-tema" onClick="{{alternarTema}}" aria-label="{{temaLabel}}" style="display: flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: {{c.ink}}; color: {{c.bg}}; border-radius: 999px; padding: 8px 16px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
        <sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
        <span class="tc-tema-txt">{{temaTexto}}</span>
      </button>
    </div>
    <sc-if value="{{menuAberto}}" hint-placeholder-val="{{false}}">
      <button type="button" class="tc-fundo" onClick="{{fecharMenu}}" aria-label="Fechar o menu" tabindex="-1"></button>
      <nav id="tc-painel" class="tc-painel" aria-label="Menu" style="background: {{c.bg}}; color: {{c.ink}}; border-right: 2px solid {{c.ink}};">
        <div class="tc-painel-topo"><span>Tempo Continuum</span><button type="button" onClick="{{fecharMenu}}">Fechar</button></div>
        <a href="index.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Início</a>
        <a href="noticias.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Notícias</a>
        <a href="streaming.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Streaming</a>
        <a href="ferramentas.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Recursos</a>
        <a href="cursos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Academia</a>
        <a href="politicos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Wiki</a>
        <a href="dossies.html" aria-current="page" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}}; background: #556A2F; color: #FFFAF0;">Dossiês</a>
        <a href="publicacoes.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Publicações</a>
      </nav>
    </sc-if>
  </header>

  <main style="max-width: 760px; margin: 0 auto; padding: 32px 24px 80px; display: flex; flex-direction: column; gap: 28px;">
    <p class="tc-nao-imprimir" style="margin: 0; font-size: 13px; color: {{c.muted}};"><a href="index.html" style="text-underline-offset: 3px;">Início</a> / <a href="dossies.html" style="text-underline-offset: 3px;">Dossiês</a> / Dossiê</p>

    <sc-if value="{{carregando}}" hint-placeholder-val="{{false}}">
      <p role="status" style="margin: 0; font-size: 1.1rem; color: {{c.muted}};">Carregando o dossiê…</p>
    </sc-if>

    <sc-if value="{{naoEncontrado}}" hint-placeholder-val="{{false}}">
      <div style="border: 1.5px dashed {{c.line}}; padding: 28px 24px; display: flex; flex-direction: column; gap: 10px;">
        <strong style="font-size: 1.3rem; font-weight: 500;">Dossiê não encontrado</strong>
        <span style="color: {{c.muted}};">Ele pode ter sido tirado do ar ou o endereço está incompleto.</span>
        <a href="dossies.html" style="align-self: flex-start; text-underline-offset: 3px;">Ver todos os dossiês</a>
      </div>
    </sc-if>

    <sc-if value="{{temDossie}}" hint-placeholder-val="{{true}}">
      <article style="display: flex; flex-direction: column; gap: 28px;">

        <!-- Capa do PDF (só no papel) -->
        <section class="tc-so-pdf tc-capa-pdf" style="flex-direction: column; justify-content: space-between; gap: 28px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <img src="logos/logo-claro.svg" alt="" width="52" height="52" style="display: block; width: 52px; height: 52px; border-radius: 50%; object-fit: cover;">
            <span style="font-size: 12px; line-height: 1.05; letter-spacing: 0.08em; text-transform: uppercase;">Tempo<br>Continuum</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 18px;">
            <span style="align-self: flex-start; background: #556A2F; color: #FFFAF0; padding: 4px 12px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;">{{d.rotulo}} · {{d.capitulosTexto}}</span>
            <h1 style="margin: 0; font-size: 34pt; line-height: 1.05; letter-spacing: -0.02em;">{{d.titulo}}</h1>
            <sc-if value="{{d.temLinha}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 14pt; line-height: 1.45; color: #2F2E25;">{{d.linha}}</p></sc-if>
          </div>
          <sc-if value="{{d.temCapa}}" hint-placeholder-val="{{false}}"><img src="{{d.capa}}" referrerpolicy="no-referrer" alt="" style="display: block; width: 100%; max-height: 100mm; object-fit: cover;"></sc-if>
          <div style="border-top: 2px solid #101010; padding-top: 10px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 10pt;">
            <span>{{d.autorOuRedacao}}</span>
            <span>{{d.dataTexto}}<sc-if value="{{d.temEditado}}" hint-placeholder-val="{{false}}"> · atualizado em {{d.editadoTexto}}</sc-if></span>
          </div>
        </section>

        <!-- Cabeçalho na tela -->
        <header class="tc-nao-imprimir" style="display: flex; flex-direction: column; gap: 16px;">
          <div style="display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: {{c.muted}};">
            <span style="background: #556A2F; color: #FFFAF0; padding: 3px 10px; letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px;">{{d.rotulo}} · {{d.capitulosTexto}}</span>
            <span>{{d.dataTexto}}</span>
            <sc-if value="{{d.temAutor}}" hint-placeholder-val="{{true}}"><span>· {{d.autor}}</span></sc-if>
            <sc-if value="{{d.temEditado}}" hint-placeholder-val="{{false}}"><span>· Atualizado em {{d.editadoTexto}}</span></sc-if>
          </div>
          <h1 style="margin: 0; font-size: clamp(2.1rem, 6vw, 3.2rem); line-height: 1.06; letter-spacing: -0.02em; text-wrap: balance;">{{d.titulo}}</h1>
          <sc-if value="{{d.temLinha}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 1.2rem; line-height: 1.5; color: {{c.muted}};">{{d.linha}}</p></sc-if>
          <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
            <sc-if value="{{temPdf}}" hint-placeholder-val="{{false}}">
              <a href="{{pdf}}" download="{{pdfNome}}" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; background: #556A2F; color: #FFFAF0; padding: 12px 18px; font-size: 14px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Baixar PDF</a>
            </sc-if>
            <sc-if value="{{semPdf}}" hint-placeholder-val="{{true}}">
              <button type="button" onClick="{{imprimir}}" title="Abre a janela de impressão: escolha &quot;Salvar como PDF&quot;" style="display: inline-flex; align-items: center; gap: 8px; font: inherit; border: 0; cursor: pointer; background: #556A2F; color: #FFFAF0; padding: 12px 18px; font-size: 14px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Baixar PDF</button>
            </sc-if>
            <a href="#sumario" style="text-decoration: none; border: 2px solid {{c.ink}}; padding: 10px 16px; font-size: 14px;">Sumário</a>
          </div>
          <sc-if value="{{semPdf}}" hint-placeholder-val="{{true}}"><small style="font-size: 12px; color: {{c.muted}};">Na janela de impressão, escolha "Salvar como PDF".</small></sc-if>
        </header>

        <sc-if value="{{d.temCapa}}" hint-placeholder-val="{{false}}">
          <figure class="tc-nao-imprimir" style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
            <img src="{{d.capa}}" referrerpolicy="no-referrer" alt="{{d.legenda}}" style="display: block; width: 100%; height: auto; border: 1px solid {{c.line}}; box-sizing: border-box;">
            <sc-if value="{{d.temLegenda}}" hint-placeholder-val="{{false}}"><figcaption style="font-size: 13px; line-height: 1.45; color: {{c.muted}};">{{d.legenda}}<sc-if value="{{d.temCredito}}" hint-placeholder-val="{{false}}"> · Foto: {{d.credito}}</sc-if></figcaption></sc-if>
          </figure>
        </sc-if>

        <sc-for list="{{metasLigados}}" as="ml" hint-placeholder-count="0">
          <aside class="tc-nao-imprimir" style="display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 14px 16px; background: {{c.surface}}; border-left: 4px solid #556A2F; font-size: 15px; line-height: 1.45;">
            <p style="margin: 0; flex: 1 1 280px;">Este dossiê faz parte do meta-dossiê <strong style="font-weight: 600;">{{ml.titulo}}</strong>, que reúne {{ml.contagem}} sobre o tema num documento só.</p>
            <a href="{{ml.href}}" style="text-decoration: none; border: 2px solid {{c.ink}}; padding: 8px 14px; font-size: 14px; white-space: nowrap;">Ver o meta-dossiê →</a>
          </aside>
        </sc-for>
        <sc-for list="{{casosLigados}}" as="kl" hint-placeholder-count="0">
          <aside class="tc-nao-imprimir" style="display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 14px 16px; background: {{c.surface}}; border-left: 4px solid #556A2F; font-size: 15px; line-height: 1.45;">
            <p style="margin: 0; flex: 1 1 280px;">O caso <strong style="font-weight: 600;">{{kl.titulo}}</strong> ({{kl.status}}) faz parte deste dossiê. Acompanhe a situação, os envolvidos e os documentos.</p>
            <a href="{{kl.href}}" style="text-decoration: none; border: 2px solid {{c.ink}}; padding: 8px 14px; font-size: 14px; white-space: nowrap;">Ver o caso →</a>
          </aside>
        </sc-for>

        <nav id="sumario" class="tc-sumario" aria-label="Sumário" style="border-top: 2px solid {{c.ink}}; border-bottom: 1px solid {{c.line}}; padding: 18px 0; scroll-margin-top: 110px; display: flex; flex-direction: column; gap: 10px;">
          <span style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}};">Sumário</span>
          <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; font-size: 1.05rem;">
            <sc-for list="{{capitulos}}" as="k" hint-placeholder-count="4">
              <sc-if value="{{k.temParte}}" hint-placeholder-val="{{false}}"><li style="padding: 14px 0 6px; border-bottom: 1px solid {{c.line}}; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.muted}};"><a href="{{k.parteHref}}" style="line-height: 1.35;"><span style="color: #556A2F;">Parte {{k.parteN}}</span> · {{k.parteTitulo}}</a></li></sc-if>
              <sc-if value="{{k.temCapitulo}}" hint-placeholder-val="{{true}}"><li style="display: flex; gap: 14px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid {{c.line}};"><span style="flex: none; width: 2.2em; color: #556A2F; font-variant-numeric: tabular-nums;">{{k.n}}</span><a href="{{k.href}}" style="line-height: 1.35;">{{k.titulo}}</a></li></sc-if>
            </sc-for>
          </ol>
        </nav>

        <sc-if value="{{temApresentacao}}" hint-placeholder-val="{{true}}">
          <div class="tc-texto tc-apresentacao" style="display: flex; flex-direction: column; gap: 18px; font-size: 1.12rem; line-height: 1.7;">
<sc-for list="{{apresentacao}}" as="b" hint-placeholder-count="4">
            <sc-if value="{{b.h2}}" hint-placeholder-val="{{false}}"><h2 style="margin: 12px 0 0; font-size: 1.5rem; line-height: 1.2;"><sc-for list="{{b.segs}}" as="g" hint-placeholder-count="1"><sc-if value="{{g.link}}" hint-placeholder-val="{{false}}"><a href="{{g.href}}" target="{{g.alvo}}" rel="noopener noreferrer" style="text-underline-offset: 3px;">{{g.t}}</a></sc-if><sc-if value="{{g.forte}}" hint-placeholder-val="{{false}}"><strong style="font-weight: 500; background: {{c.surface}}; padding: 0 2px;">{{g.t}}</strong></sc-if><sc-if value="{{g.enfase}}" hint-placeholder-val="{{false}}"><em>{{g.t}}</em></sc-if><sc-if value="{{g.simples}}" hint-placeholder-val="{{true}}">{{g.t}}</sc-if></sc-for></h2></sc-if>
            <sc-if value="{{b.h3}}" hint-placeholder-val="{{false}}"><h3 style="margin: 8px 0 0; font-size: 1.2rem; line-height: 1.25;"><sc-for list="{{b.segs}}" as="g" hint-placeholder-count="1"><sc-if value="{{g.link}}" hint-placeholder-val="{{false}}"><a href="{{g.href}}" target="{{g.alvo}}" rel="noopener noreferrer" style="text-underline-offset: 3px;">{{g.t}}</a></sc-if><sc-if value="{{g.forte}}" hint-placeholder-val="{{false}}"><strong style="font-weight: 500; background: {{c.surface}}; padding: 0 2px;">{{g.t}}</strong></sc-if><sc-if value="{{g.enfase}}" hint-placeholder-val="{{false}}"><em>{{g.t}}</em></sc-if><sc-if value="{{g.simples}}" hint-placeholder-val="{{true}}">{{g.t}}</sc-if></sc-for></h3></sc-if>

<script>
// Página de um dossiê: dossie.html?id=<id>. Lê conteudo/dossies/<id>.md.
// ?pdf=arquivo  → usada pelo servidor para gerar o PDF (tema claro, sem abrir a janela de impressão)
// ?pdf=previa   → abre a janela de impressão assim que o texto carrega
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { escuro: null, menuAberto: false, dossie: null, status: 'carregando', pdf: '', imprimindo: false };
  }
  componentDidMount() {
    var self = this, q = new URLSearchParams(window.location.search);
    var meta = q.get('meta') || '', id = meta || q.get('id') || '', modoPdf = q.get('pdf') || '';
    try {
      var v = window.localStorage.getItem('tc-tema');
      if (v === 'escuro' || v === 'claro') this.setState({ escuro: v === 'escuro' });
    } catch (e) {}
    if (modoPdf) this.setState({ imprimindo: true });
    // Na impressão, sempre o tema claro
    window.addEventListener('beforeprint', function () { self.setState({ imprimindo: true }); });
    window.addEventListener('afterprint', function () { if (!modoPdf) self.setState({ imprimindo: false }); });
    if (!/^[a-z0-9][a-z0-9-]*$/.test(id)) { this.setState({ status: 'erro' }); return; }
    var texto = function (url) { return fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }); };
    var pronto = function (d, partes) {
      d.id = id;
      self.setState({ dossie: d, partes: partes, status: 'ok' });
      try { document.title = d.titulo + (meta ? ' — Meta-dossiê' : ' — Dossiê') + ' — Tempo Continuum'; } catch (e) {}
      if (modoPdf === 'previa') self.imprimirQuandoPronto();
    };
    if (meta) {
      // Meta-dossiê: o arquivo dele e, na ordem da lista, cada dossiê que ele junta (os que faltarem ficam de fora)
      texto('conteudo/metadossies/' + id + '.md')
        .then(function (t) {
          var d = TCMarkdown.lerMetaDossie(t);
          return Promise.all(d.dossies.filter(function (x) { return /^[a-z0-9][a-z0-9-]*$/.test(x); }).map(function (x) {
            return texto('conteudo/dossies/' + x + '.md').then(function (tx) { var p = TCMarkdown.lerDossie(tx); p.id = x; return p; }, function () { return null; });
          })).then(function (partes) { pronto(d, partes.filter(Boolean)); });
        })
        .catch(function () { self.setState({ status: 'erro' }); });
    } else {
      texto('conteudo/dossies/' + id + '.md')
        .then(function (t) { pronto(TCMarkdown.lerDossie(t), null); })
        .catch(function () { self.setState({ status: 'erro' }); });
    }
    if (modoPdf !== 'arquivo' && !meta) {
      // Ligações do dossiê: meta-dossiês que o reúnem (ou que estão nas tags dele) e casos que têm o título dele como tag
      [['metadossies', 'metas'], ['casos', 'casos']].forEach(function (x) {
        fetch('dados/' + x[0] + '.json', { cache: 'no-cache' })
          .then(function (r) { return r.ok ? r.json() : []; })

  // Espera as imagens e a fonte antes de abrir a janela de impressão

          parteTextos: paragrafos(pp.apresentacao), parteAncora: 'parte-' + p.id, parteHref: '#parte-' + p.id,
