<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo Continuum — Streaming</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&amp;display=swap">
<style>
body{margin:0;font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-weight:500}
h1,h2,h3,h4,p{font-weight:500}
a{color:inherit}a:hover{text-decoration-thickness:2px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width: 760px){
.tc-header-row{flex-wrap:nowrap !important;gap:8px !important;padding:10px 16px !important}
.tc-nav,.tc-buscar{display:none !important}
.tc-logo{margin-right:auto;min-width:0}
.tc-tema-txt{display:none}
.tc-tema{padding:8px 12px !important}
.tc-chips{flex-wrap:nowrap !important;overflow-x:auto;padding-bottom:8px;margin-right:-16px;padding-right:16px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tc-chips>*{flex:none}
main{padding-left:16px !important;padding-right:16px !important;gap:32px !important}
footer>div{padding-left:16px !important;padding-right:16px !important}
}

/* Cabeçalho fixo e menu lateral */
.tc-topo{position:sticky;top:0;z-index:50}
.tc-menu-btn{display:flex !important}
.tc-painel{display:block !important;position:fixed;top:0;left:0;bottom:0;width:min(340px,86vw);overflow-y:auto;z-index:70;box-shadow:8px 0 32px rgba(16,16,16,.35);padding:12px 16px 24px !important;border-top:0 !important;box-sizing:border-box}
.tc-fundo{position:fixed;inset:0;z-index:60;background:rgba(16,16,16,.45);border:0;padding:0;cursor:pointer}
.tc-painel-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.tc-painel-topo button{font:inherit;font-size:14px;letter-spacing:0;text-transform:none;background:none;border:2px solid currentColor;color:inherit;border-radius:999px;padding:6px 14px;cursor:pointer}
/* Cabeçalho em uma linha só: ocupa a largura toda da janela */
.tc-header-row{max-width:none !important;flex-wrap:nowrap !important;gap:12px 20px !important}
.tc-nav{flex-wrap:nowrap !important;flex:1 1 auto !important;min-width:0}
.tc-nav a{white-space:nowrap}
@media (max-width: 1320px){.tc-nav{gap:2px !important}.tc-nav a{padding:8px 10px !important}.tc-buscar,.tc-menu-btn{font-size:0 !important;gap:0 !important;padding:8px 13px !important}.tc-tema-txt{display:none}.tc-tema{padding:8px 13px !important}}
@media (max-width: 1100px){.tc-nav,.tc-buscar{display:none !important}.tc-logo{margin-right:auto;min-width:0}}
</style>
<style>html,body{margin:0} #app > div{min-height:100vh}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="background: {{c.bg}}; color: {{c.ink}}; min-height: 100%; font-family: &quot;Montserrat&quot;, Arial, sans-serif; font-weight: 500;">

  <header class="tc-topo" style="background: {{c.bg}}; color: {{c.ink}}; border-bottom: 2px solid {{c.ink}};">
    <div class="tc-header-row" style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 40px;">
      <button type="button" class="tc-menu-btn" onClick="{{alternarMenu}}" aria-expanded="{{menuAbertoTxt}}" aria-controls="tc-painel" style="align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: transparent; color: {{c.ink}}; border-radius: 999px; padding: 8px 14px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{menuFechado}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></sc-if>
        <sc-if value="{{menuAberto}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
        Menu
      </button>
      <a class="tc-logo" href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;" aria-label="Tempo Continuum, início">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><img src="logos/logo-claro.svg" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if><sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><img src="logos/logo-escuro.svg" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if>
        <span style="font-size: 13px; line-height: 1.05; letter-spacing: 0.08em; text-transform: uppercase;">Tempo<br>Continuum</span>
      </a>
      <nav class="tc-nav" aria-label="Seções" style="display: flex; flex-wrap: wrap; gap: 6px 8px; flex: 1 1 560px; font-size: 15px;">
        <a href="noticias.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Notícias</a>
        <a href="streaming.html" aria-current="page" style="text-decoration: none; padding: 8px 14px; border-radius: 999px; background: #556A2F; color: #FFFAF0;">Streaming</a>
        <a href="ferramentas.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Recursos</a>
        <a href="cursos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Academia</a>
        <a href="politicos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Wiki</a>
        <a href="dossies.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Dossiês</a>
        <a href="publicacoes.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Publicações</a>
      </nav>
      <a class="tc-buscar" href="noticias.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; border: 2px solid {{c.ink}}; border-radius: 999px; padding: 8px 16px; font-size: 14px; min-height: 44px; box-sizing: border-box;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar</a>
      <button type="button" class="tc-tema" onClick="{{alternarTema}}" aria-label="{{temaLabel}}" style="display: flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: {{c.ink}}; color: {{c.bg}}; border-radius: 999px; padding: 8px 16px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
        <sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
        <span class="tc-tema-txt">{{temaTexto}}</span>
      </button>
    </div>
    <sc-if value="{{menuAberto}}" hint-placeholder-val="{{false}}">
      <button type="button" class="tc-fundo" onClick="{{fecharMenu}}" aria-label="Fechar o menu" tabindex="-1"></button>
      <nav id="tc-painel" class="tc-painel" aria-label="Menu" style="background: {{c.bg}}; color: {{c.ink}}; border-right: 2px solid {{c.ink}};">
        <div class="tc-painel-topo"><span>Tempo Continuum</span><button type="button" onClick="{{fecharMenu}}">Fechar</button></div>
        <a href="index.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Início</a>
        <a href="noticias.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Notícias</a>
        <a href="streaming.html" aria-current="page" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}}; background: #556A2F; color: #FFFAF0;">Streaming</a>
        <a href="ferramentas.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Recursos</a>
        <a href="cursos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Academia</a>
        <a href="politicos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Wiki</a>
        <a href="dossies.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Dossiês</a>
        <a href="publicacoes.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Publicações</a>
        <a href="noticias.html" onClick="{{fecharMenu}}" style="text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 14px 12px; font-size: 18px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar</a>
      </nav>
    </sc-if>
  </header>

  <main style="max-width: 1240px; margin: 0 auto; padding: 32px 24px 80px; display: flex; flex-direction: column; gap: 40px;">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <p style="margin: 0; font-size: 13px; color: {{c.muted}};"><a href="index.html" style="text-underline-offset: 3px;">Início</a> / Streaming</p>
      <h1 style="margin: 0; font-size: clamp(2.4rem, 5vw, 3.6rem); line-height: 1; letter-spacing: -0.02em;"><span style="background: #556A2F; color: #FFFAF0; padding: 0 10px;">Streaming</span></h1>
      <p style="margin: 0; font-size: 1.1rem; line-height: 1.55; color: {{c.muted}}; max-width: 60ch;">Documentários e vídeos do YouTube sobre história, trabalho e luta política no Brasil.</p>
      <nav aria-label="Partes da página" style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px;">
        <a href="#documentarios" style="text-decoration: none; padding: 8px 14px; border-radius: 999px; border: 1.5px solid {{c.line}};">Documentários</a>
        <a href="#youtube" style="text-decoration: none; padding: 8px 14px; border-radius: 999px; border: 1.5px solid {{c.line}};">Vídeos do YouTube</a>
      </nav>
    </div>

    <section id="documentarios" aria-labelledby="h-documentarios" style="display: flex; flex-direction: column; gap: 32px; scroll-margin-top: 16px;">
    <div style="border-top: 2px solid {{c.ink}}; padding-top: 16px;">
      <h2 id="h-documentarios" style="margin: 0; font-size: 2rem; letter-spacing: -0.01em;">Documentários</h2>
    </div>

    <article style="display: flex; flex-wrap: wrap; gap: 28px;">
      <div style="flex: 999 1 560px; min-width: 0; aspect-ratio: 16 / 9; background: #101010; position: relative; display: flex; align-items: center; justify-content: center;">
        <span style="width: 76px; height: 76px; border-radius: 50%; background: #556A2F; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="#FFFAF0" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span>
        <span style="position: absolute; right: 12px; bottom: 12px; background: #FFFAF0; color: #101010; font-size: 13px; padding: 3px 10px;">[00:00]</span>
      </div>
      <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px; justify-content: center;">
        <span style="align-self: flex-start; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; background: #556A2F; color: #FFFAF0; padding: 3px 10px;">Lançamento</span>
        <h2 style="margin: 0; font-size: clamp(1.6rem, 3vw, 2.4rem); line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance;">[Título do documentário em destaque]</h2>
        <p style="margin: 0; font-size: 1rem; line-height: 1.55; color: {{c.muted}};">[Duas frases sobre o tema do filme e quem aparece nele.]</p>
        <a href="#" style="align-self: flex-start; text-decoration: none; background: #556A2F; color: #FFFAF0; padding: 12px 20px; font-size: 14px;">Assistir agora</a>
      </div>
    </article>

    <div class="tc-chips" style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px;">
      <a href="#" style="text-decoration: none; padding: 6px 12px; border-radius: 999px; background: #556A2F; color: #FFFAF0; border: 1.5px solid #556A2F;">Todos</a>
      <a href="#" style="text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1.5px solid {{c.line}};">Curtas</a>
      <a href="#" style="text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1.5px solid {{c.line}};">Longas</a>
      <a href="#" style="text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1.5px solid {{c.line}};">Séries</a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 36px 28px;">
      <article style="display: flex; flex-direction: column; gap: 12px;">
        <div style="aspect-ratio: 16 / 9; background: #101010; position: relative; display: flex; align-items: center; justify-content: center;"><span style="width: 52px; height: 52px; border-radius: 50%; background: #556A2F; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFAF0" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span><span style="position: absolute; right: 10px; bottom: 10px; background: #FFFAF0; color: #101010; font-size: 12px; padding: 2px 8px;">[00:00]</span></div>
        <h3 style="margin: 0; font-size: 1.15rem; line-height: 1.3;">[Título do documentário]</h3>
        <p style="margin: 0; font-size: 0.9rem; color: {{c.muted}};">[Uma frase sobre o tema do filme.]</p>
      </article>
      <article style="display: flex; flex-direction: column; gap: 12px;">
        <div style="aspect-ratio: 16 / 9; background: #101010; position: relative; display: flex; align-items: center; justify-content: center;"><span style="width: 52px; height: 52px; border-radius: 50%; background: #556A2F; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFAF0" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span><span style="position: absolute; right: 10px; bottom: 10px; background: #FFFAF0; color: #101010; font-size: 12px; padding: 2px 8px;">[00:00]</span></div>
        <h3 style="margin: 0; font-size: 1.15rem; line-height: 1.3;">[Título do documentário]</h3>
        <p style="margin: 0; font-size: 0.9rem; color: {{c.muted}};">[Uma frase sobre o tema do filme.]</p>
      </article>
      <article style="display: flex; flex-direction: column; gap: 12px;">
        <div style="aspect-ratio: 16 / 9; background: #101010; position: relative; display: flex; align-items: center; justify-content: center;"><span style="width: 52px; height: 52px; border-radius: 50%; background: #556A2F; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFAF0" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span><span style="position: absolute; right: 10px; bottom: 10px; background: #FFFAF0; color: #101010; font-size: 12px; padding: 2px 8px;">[00:00]</span></div>
        <h3 style="margin: 0; font-size: 1.15rem; line-height: 1.3;">[Título do documentário]</h3>
        <p style="margin: 0; font-size: 0.9rem; color: {{c.muted}};">[Uma frase sobre o tema do filme.]</p>
      </article>
      <article style="display: flex; flex-direction: column; gap: 12px;">
        <div style="aspect-ratio: 16 / 9; background: #101010; position: relative; display: flex; align-items: center; justify-content: center;"><span style="width: 52px; height: 52px; border-radius: 50%; background: #556A2F; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFAF0" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span><span style="position: absolute; right: 10px; bottom: 10px; background: #FFFAF0; color: #101010; font-size: 12px; padding: 2px 8px;">[00:00]</span></div>
        <h3 style="margin: 0; font-size: 1.15rem; line-height: 1.3;">[Título do documentário]</h3>
        <p style="margin: 0; font-size: 0.9rem; color: {{c.muted}};">[Uma frase sobre o tema do filme.]</p>
      </article>
      <article style="display: flex; flex-direction: column; gap: 12px;">
        <div style="aspect-ratio: 16 / 9; background: #101010; position: relative; display: flex; align-items: center; justify-content: center;"><span style="width: 52px; height: 52px; border-radius: 50%; background: #556A2F; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFAF0" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span><span style="position: absolute; right: 10px; bottom: 10px; background: #FFFAF0; color: #101010; font-size: 12px; padding: 2px 8px;">[00:00]</span></div>
        <h3 style="margin: 0; font-size: 1.15rem; line-height: 1.3;">[Título do documentário]</h3>
        <p style="margin: 0; font-size: 0.9rem; color: {{c.muted}};">[Uma frase sobre o tema do filme.]</p>
      </article>
      <article style="display: flex; flex-direction: column; gap: 12px;">
        <div style="aspect-ratio: 16 / 9; background: #101010; position: relative; display: flex; align-items: center; justify-content: center;"><span style="width: 52px; height: 52px; border-radius: 50%; background: #556A2F; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFAF0" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span><span style="position: absolute; right: 10px; bottom: 10px; background: #FFFAF0; color: #101010; font-size: 12px; padding: 2px 8px;">[00:00]</span></div>
        <h3 style="margin: 0; font-size: 1.15rem; line-height: 1.3;">[Título do documentário]</h3>
        <p style="margin: 0; font-size: 0.9rem; color: {{c.muted}};">[Uma frase sobre o tema do filme.]</p>
      </article>
    </div>
    </section>

    <section id="youtube" aria-labelledby="h-youtube" style="display: flex; flex-direction: column; gap: 24px; scroll-margin-top: 16px;">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 2px solid {{c.ink}}; padding-top: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <h2 id="h-youtube" style="margin: 0; font-size: 2rem; letter-spacing: -0.01em;">Vídeos do YouTube</h2>
          <p style="margin: 0; font-size: 0.95rem; color: {{c.muted}};">Vídeos que recomendamos, de canais parceiros e de quem pesquisa e luta. Abrem direto no YouTube.</p>
        </div>
        <span style="font-size: 14px; color: {{c.muted}};">{{contagemVideos}}</span>
      </div>
      <sc-if value="{{carregandoVideos}}" hint-placeholder-val="{{false}}">
        <p style="margin: 0; color: {{c.muted}};">Carregando vídeos…</p>
      </sc-if>
      <sc-if value="{{semVideos}}" hint-placeholder-val="{{false}}">
        <p style="margin: 0; padding: 24px; border: 1.5px dashed {{c.line}}; color: {{c.muted}};">{{vazioVideos}}</p>
      </sc-if>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 36px 28px;">
        <sc-for list="{{videos}}" as="v" hint-placeholder-count="3">
          <a href="{{v.link}}" target="_blank" rel="noopener noreferrer" aria-label="{{v.rotulo}}" style="text-decoration: none; display: flex; flex-direction: column; gap: 10px;">
            <div style="aspect-ratio: 16 / 9; background: #101010; position: relative; overflow: hidden;">
              <sc-if value="{{v.temCapa}}" hint-placeholder-val="{{true}}"><img src="{{v.capa}}" alt="" referrerpolicy="no-referrer" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;"></sc-if>
              <span style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 56px; height: 56px; border-radius: 50%; background: rgba(85, 106, 47, 0.55); border: 1.5px solid rgba(255, 250, 240, 0.45); box-sizing: border-box; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFAF0" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span>
              <span style="position: absolute; right: 10px; bottom: 10px; background: #FFFAF0; color: #101010; font-size: 12px; padding: 2px 8px;">YouTube ↗</span>
            </div>
            <h3 style="margin: 0; font-size: 1.15rem; line-height: 1.3; text-wrap: balance;">{{v.titulo}}</h3>
            <p style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: {{c.muted}};"><sc-if value="{{v.temFotoCriador}}" hint-placeholder-val="{{true}}"><img src="{{v.fotoCriador}}" alt="" referrerpolicy="no-referrer" width="32" height="32" loading="lazy" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex: none; background: {{c.surface}};"></sc-if><span style="min-width: 0;">{{v.criador}}</span></p>
          </a>
        </sc-for>
      </div>
    </section>
  </main>

  <footer style="background: #101010; color: #FFFAF0; border-top: 1px solid {{c.line}};">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px 40px; display: flex; flex-wrap: wrap; gap: 40px; justify-content: space-between;">
      <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
        <p style="margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;">Tempo Continuum</p>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { escuro: null };
  }
  componentDidMount() {
    try {
      var v = window.localStorage.getItem('tc-tema');
      if (v === 'escuro' || v === 'claro') this.setState({ escuro: v === 'escuro' });
    } catch (e) {}
    var self = this;
    fetch('dados/videos.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (lista) {
        self.setState({ videos: Array.isArray(lista) ? lista : [] });
        // Link direto para uma parte (streaming.html#youtube)
        var alvo = decodeURIComponent(location.hash.slice(1));
        if (alvo) setTimeout(function () { var el = document.getElementById(alvo); if (el) el.scrollIntoView(); }, 0);
      })
      .catch(function () { self.setState({ videos: [], erroVideos: true }); });
  }
  renderVals() {
    var escuro = (this.state && this.state.escuro !== null && this.state.escuro !== undefined)
      ? this.state.escuro
      : (this.props.tema ?? 'claro') === 'escuro';
    var self = this;
    var c = escuro
      ? { bg: '#101010', surface: '#2F2E25', ink: '#FFFAF0', muted: '#DDD5CA', line: 'rgba(221, 213, 202, 0.3)' }
      : { bg: '#FFFAF0', surface: '#DDD5CA', ink: '#101010', muted: '#2F2E25', line: 'rgba(47, 46, 37, 0.28)' };
    var st = this.state || {};
    var seguro = function (u) { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; };
    var videos = (st.videos || []).filter(function (v) { return seguro(v.link) && v.titulo; }).map(function (v) {
      var imagem = function (src) { return /^https?:/i.test(src || '') ? seguro(src) : String(src || '').replace(/^\/+/, ''); };
      var capa = imagem(v.capa), fotoCriador = imagem(v.foto_criador);
      return {
        titulo: v.titulo, criador: v.criador || '', link: seguro(v.link), capa: capa, temCapa: !!capa,
        fotoCriador: fotoCriador, temFotoCriador: !!fotoCriador,
        rotulo: v.titulo + (v.criador ? ', de ' + v.criador : '') + ' (abre no YouTube)'
      };
    });
    var carregandoVideos = st.videos === undefined || st.videos === null;
    return {
      videos: videos,
      carregandoVideos: carregandoVideos,
      semVideos: !carregandoVideos && !videos.length,
      vazioVideos: st.erroVideos ? 'Não deu para carregar os vídeos. Recarregue a página em instantes.' : 'Nenhum vídeo publicado ainda.',
      contagemVideos: carregandoVideos || !videos.length ? '' : videos.length + (videos.length === 1 ? ' vídeo' : ' vídeos'),
      menuAberto: !!(this.state && this.state.menuAberto),
      menuFechado: !(this.state && this.state.menuAberto),
      menuAbertoTxt: (this.state && this.state.menuAberto) ? 'true' : 'false',
      alternarMenu: (function (eu) { return function () { eu.setState({ menuAberto: !(eu.state && eu.state.menuAberto) }); }; })(this),
      fecharMenu: (function (eu) { return function () { eu.setState({ menuAberto: false }); }; })(this),
      c: c,
      escuro: escuro,
      claro: !escuro,
      temaTexto: escuro ? 'Claro' : 'Escuro',
      temaLabel: escuro ? 'Mudar para o tema claro' : 'Mudar para o tema escuro',
      alternarTema: function () {
        var novo = !escuro;
        self.setState({ escuro: novo });
        try { window.localStorage.setItem('tc-tema', novo ? 'escuro' : 'claro'); } catch (e) {}
      }
    };
  }
}
iniciarPagina(Component, {"tema": "claro"});
</script>
