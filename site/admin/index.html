<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Editor · Tempo Continuum</title>
  <link rel="icon" href="../logos/logo-escuro.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="./" title="Recarregar o editor">
      <img src="../logos/logo-claro.svg" alt="" class="logo-claro"><img src="../logos/logo-escuro.svg" alt="" class="logo-escuro">
      <span>Tempo Continuum <b>Editor</b></span>
    </a>
    <nav class="abas" aria-label="Coleções">
      <button type="button" data-tipo="noticias" aria-pressed="true">Matérias</button>
      <button type="button" data-tipo="politicos" aria-pressed="false">Políticos</button>
      <button type="button" data-tipo="votacoes" aria-pressed="false">Votações</button>
      <button type="button" data-tipo="videos" aria-pressed="false">Vídeos</button>
      <button type="button" data-tipo="publicacoes" aria-pressed="false">Publicações</button>
      <button type="button" data-tipo="dossies" aria-pressed="false">Dossiês</button>
    </nav>
    <div class="topo-acoes">
      <a href="../" target="_blank" rel="noopener">Ver site</a>
      <button type="button" id="tema" class="botao-texto">Escuro</button>
    </div>
  </header>

  <div class="corpo">
    <aside class="lateral" aria-label="Lista">
      <div class="lateral-topo">
        <button type="button" id="novo" class="botao principal">+ Nova matéria</button>
        <input type="search" id="busca" placeholder="Buscar" aria-label="Buscar na lista">
      </div>
      <ul id="lista" class="lista"></ul>
    </aside>

    <main id="area" class="area">
      <div class="vazio">
        <p>Escolha uma matéria na lista ou crie uma nova.</p>
      </div>
    </main>
  </div>

  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

  <dialog id="galeria" class="galeria">
    <form method="dialog">
      <header><strong>Escolher uma imagem já enviada</strong><button value="fechar" class="botao-texto">Fechar</button></header>
      <div id="galeria-grade" class="galeria-grade"></div>
    </form>
  </dialog>

  <script src="../js/tags.js"></script>
  <script src="../js/markdown.js"></script>
  <script src="editor.js"></script>
</body>
</html>
