<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo Continuum — Caso acompanhado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&amp;display=swap">
<style>
body{margin:0;font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-weight:500}
h1,h2,h3,h4,p{font-weight:500}
a{color:inherit}a:hover{text-decoration-thickness:2px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width: 760px){
.tc-header-row{flex-wrap:nowrap !important;gap:8px !important;padding:10px 16px !important}
.tc-nav,.tc-buscar{display:none !important}
.tc-logo{margin-right:auto;min-width:0}
.tc-tema-txt{display:none}
.tc-tema{padding:8px 12px !important}
.tc-chips{flex-wrap:nowrap !important;overflow-x:auto;padding-bottom:8px;margin-right:-16px;padding-right:16px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tc-chips>*{flex:none}
main{padding-left:16px !important;padding-right:16px !important;gap:32px !important}
footer>div{padding-left:16px !important;padding-right:16px !important}
}

/* Cabeçalho fixo e menu lateral */
.tc-topo{position:sticky;top:0;z-index:50}
.tc-menu-btn{display:flex !important}
.tc-painel{display:block !important;position:fixed;top:0;left:0;bottom:0;width:min(340px,86vw);overflow-y:auto;z-index:70;box-shadow:8px 0 32px rgba(16,16,16,.35);padding:12px 16px 24px !important;border-top:0 !important;box-sizing:border-box}
.tc-fundo{position:fixed;inset:0;z-index:60;background:rgba(16,16,16,.45);border:0;padding:0;cursor:pointer}
.tc-painel-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.tc-painel-topo button{font:inherit;font-size:14px;letter-spacing:0;text-transform:none;background:none;border:2px solid currentColor;color:inherit;border-radius:999px;padding:6px 14px;cursor:pointer}
/* Cabeçalho em uma linha só: ocupa a largura toda da janela */
.tc-header-row{max-width:none !important;flex-wrap:nowrap !important;gap:12px 20px !important}
.tc-nav{flex-wrap:nowrap !important;flex:1 1 auto !important;min-width:0}
.tc-nav a{white-space:nowrap}
@media (max-width: 1320px){.tc-nav{gap:2px !important}.tc-nav a{padding:8px 10px !important}.tc-buscar,.tc-menu-btn{font-size:0 !important;gap:0 !important;padding:8px 13px !important}.tc-tema-txt{display:none}.tc-tema{padding:8px 13px !important}}
@media (max-width: 1100px){.tc-nav,.tc-buscar{display:none !important}.tc-logo{margin-right:auto;min-width:0}}
</style>
<style>html,body{margin:0} #app > div{min-height:100vh}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="background: {{c.bg}}; color: {{c.ink}}; min-height: 100%; font-family: &quot;Montserrat&quot;, Arial, sans-serif; font-weight: 500;">

  <header class="tc-topo" style="background: {{c.bg}}; color: {{c.ink}}; border-bottom: 2px solid {{c.ink}};">
    <div class="tc-header-row" style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 40px;">
      <button type="button" class="tc-menu-btn" onClick="{{alternarMenu}}" aria-expanded="{{menuAbertoTxt}}" aria-controls="tc-painel" style="align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: transparent; color: {{c.ink}}; border-radius: 999px; padding: 8px 14px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{menuFechado}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></sc-if>
        <sc-if value="{{menuAberto}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
        Menu
      </button>
      <a class="tc-logo" href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;" aria-label="Tempo Continuum, início">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><img src="logos/logo-claro.svg" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if><sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><img src="logos/logo-escuro.svg" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if>
        <span style="font-size: 13px; line-height: 1.05; letter-spacing: 0.08em; text-transform: uppercase;">Tempo<br>Continuum</span>
      </a>
      <nav class="tc-nav" aria-label="Seções" style="display: flex; flex-wrap: wrap; gap: 6px 8px; flex: 1 1 560px; font-size: 15px;">
        <a href="noticias.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Notícias</a>
        <a href="streaming.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Streaming</a>
        <a href="ferramentas.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Recursos</a>
        <a href="cursos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Academia</a>
        <a href="politicos.html" aria-current="page" style="text-decoration: none; padding: 8px 14px; border-radius: 999px; background: #556A2F; color: #FFFAF0;">Wiki</a>
        <a href="dossies.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Dossiês</a>
        <a href="publicacoes.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Publicações</a>
      </nav>
      <a class="tc-buscar" href="noticias.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; border: 2px solid {{c.ink}}; border-radius: 999px; padding: 8px 16px; font-size: 14px; min-height: 44px; box-sizing: border-box;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar</a>
      <button type="button" class="tc-tema" onClick="{{alternarTema}}" aria-label="{{temaLabel}}" style="display: flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: {{c.ink}}; color: {{c.bg}}; border-radius: 999px; padding: 8px 16px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
        <sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
        <span class="tc-tema-txt">{{temaTexto}}</span>
      </button>
    </div>
    <sc-if value="{{menuAberto}}" hint-placeholder-val="{{false}}">
      <button type="button" class="tc-fundo" onClick="{{fecharMenu}}" aria-label="Fechar o menu" tabindex="-1"></button>
      <nav id="tc-painel" class="tc-painel" aria-label="Menu" style="background: {{c.bg}}; color: {{c.ink}}; border-right: 2px solid {{c.ink}};">
        <div class="tc-painel-topo"><span>Tempo Continuum</span><button type="button" onClick="{{fecharMenu}}">Fechar</button></div>
        <a href="index.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Início</a>
        <a href="noticias.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Notícias</a>
        <a href="streaming.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Streaming</a>
        <a href="ferramentas.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Recursos</a>
        <a href="cursos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Academia</a>
        <a href="politicos.html" aria-current="page" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}}; background: #556A2F; color: #FFFAF0;">Wiki</a>
        <a href="dossies.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Dossiês</a>
        <a href="publicacoes.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Publicações</a>
        <a href="noticias.html" onClick="{{fecharMenu}}" style="text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 14px 12px; font-size: 18px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar</a>
      </nav>
    </sc-if>
  </header>

  <main style="max-width: 820px; margin: 0 auto; padding: 32px 24px 80px; display: flex; flex-direction: column; gap: 28px;">
    <p style="margin: 0; font-size: 13px; color: {{c.muted}};"><a href="index.html" style="text-underline-offset: 3px;">Início</a> / <a href="politicos.html" style="text-underline-offset: 3px;">Wiki</a> / <a href="politicos.html#casos" style="text-underline-offset: 3px;">Casos acompanhados</a></p>

    <sc-if value="{{carregando}}" hint-placeholder-val="{{false}}">
      <p role="status" style="margin: 0; font-size: 1.1rem; color: {{c.muted}};">Carregando o caso…</p>
    </sc-if>

    <sc-if value="{{naoEncontrado}}" hint-placeholder-val="{{false}}">
      <div style="border: 1.5px dashed {{c.line}}; padding: 28px 24px; display: flex; flex-direction: column; gap: 10px;">
        <strong style="font-size: 1.3rem; font-weight: 500;">Caso não encontrado</strong>
        <span style="color: {{c.muted}};">Ele pode ter sido tirado do ar ou o endereço está incompleto.</span>
        <a href="politicos.html#casos" style="align-self: flex-start; text-underline-offset: 3px;">Ver todos os casos</a>
      </div>
    </sc-if>

    <sc-if value="{{temCaso}}" hint-placeholder-val="{{true}}">
      <article style="display: flex; flex-direction: column; gap: 28px;">
        <header style="display: flex; flex-direction: column; gap: 16px;">
          <div style="display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: {{c.muted}};">
            <sc-if value="{{k.andamento}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; border: 1.5px solid {{c.ink}}; color: {{c.ink}}; padding: 4px 10px;">Em andamento</span></sc-if>
            <sc-if value="{{k.julgamento}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; background: #556A2F; color: #FFFAF0; border: 1.5px solid #556A2F; padding: 4px 10px;">Em julgamento</span></sc-if>
            <sc-if value="{{k.encerrado}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; border: 1.5px dashed {{c.muted}}; padding: 4px 10px;">Encerrado</span></sc-if>
            <span>Caso acompanhado</span>
            <span>· Aberto em {{k.abertoTexto}}</span>
            <sc-if value="{{k.temAtualizado}}" hint-placeholder-val="{{true}}"><span>· Atualizado em {{k.atualizadoTexto}}</span></sc-if>
          </div>
          <h1 style="margin: 0; font-size: clamp(2.1rem, 6vw, 3.2rem); line-height: 1.06; letter-spacing: -0.02em; text-wrap: balance;">{{k.titulo}}</h1>
        </header>

        <sc-if value="{{k.temEtapa}}" hint-placeholder-val="{{true}}">
          <section aria-label="Última etapa" style="border-left: 6px solid #556A2F; background: {{c.surface}}; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}};">Última etapa · {{k.atualizadoTexto}}</span>
            <p style="margin: 0; font-size: 1.15rem; line-height: 1.45;">{{k.etapa}}</p>
          </section>
        </sc-if>

        <div style="display: flex; flex-direction: column; gap: 16px; font-size: 1.1rem; line-height: 1.7;">
          <sc-for list="{{k.paragrafos}}" as="p" hint-placeholder-count="2"><p style="margin: 0;">{{p}}</p></sc-for>
        </div>

        <sc-for list="{{dossiesLigados}}" as="dl" hint-placeholder-count="0">
          <aside style="display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 14px 16px; background: {{c.surface}}; border-left: 4px solid #556A2F; font-size: 15px; line-height: 1.45;">
            <p style="margin: 0; flex: 1 1 280px;">Este caso faz parte do {{dl.tipo}} <strong style="font-weight: 600;">{{dl.titulo}}</strong>. Leia a investigação completa, com o contexto e as fontes.</p>
            <a href="{{dl.href}}" style="text-decoration: none; border: 2px solid {{c.ink}}; padding: 8px 14px; font-size: 14px; white-space: nowrap;">Ver o {{dl.tipo}} →</a>
          </aside>
        </sc-for>

        <sc-if value="{{temMaterias}}" hint-placeholder-val="{{true}}">
          <section aria-labelledby="h-materias" style="display: flex; flex-direction: column; gap: 4px; border-top: 2px solid {{c.ink}}; padding-top: 16px;">
            <h2 id="h-materias" style="margin: 0 0 8px; font-size: 1.4rem;">Matérias sobre o caso</h2>
            <sc-for list="{{materias}}" as="n" hint-placeholder-count="2">
              <a href="{{n.href}}" style="text-decoration: none; display: flex; flex-direction: column; gap: 4px; padding: 12px 0; border-bottom: 1px solid {{c.line}};">
                <span style="font-size: 12px; color: {{c.muted}};">{{n.dataTexto}} · {{n.editoria}}</span>
                <span style="font-size: 1.1rem; line-height: 1.3;">{{n.titulo}}</span>
              </a>
            </sc-for>
          </section>
        </sc-if>

        <sc-if value="{{k.temEnvolvidos}}" hint-placeholder-val="{{true}}">
          <section aria-labelledby="h-envolvidos" style="display: flex; flex-direction: column; gap: 4px; border-top: 2px solid {{c.ink}}; padding-top: 16px;">
            <h2 id="h-envolvidos" style="margin: 0 0 8px; font-size: 1.4rem;">Envolvidos</h2>
            <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column;">
              <sc-for list="{{k.envolvidos}}" as="e" hint-placeholder-count="3">
                <li style="display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid {{c.line}};">
                  <span>{{e.nome}}</span>
                  <sc-if value="{{e.temFicha}}" hint-placeholder-val="{{false}}"><a href="{{e.ficha}}" style="font-size: 14px; text-underline-offset: 3px;">Ver a ficha na Wiki →</a></sc-if>
                </li>
              </sc-for>
            </ul>
          </section>
        </sc-if>

        <section aria-labelledby="h-documentos" style="display: flex; flex-direction: column; gap: 4px; border-top: 2px solid {{c.ink}}; padding-top: 16px;">
          <h2 id="h-documentos" style="margin: 0 0 8px; font-size: 1.4rem;">Documentos <span style="font-size: 1rem; color: {{c.muted}};">· {{k.docsTexto}}</span></h2>
          <sc-if value="{{k.semDocumentos}}" hint-placeholder-val="{{false}}"><p style="margin: 0; color: {{c.muted}};">Ainda não há documentos reunidos neste caso.</p></sc-if>
          <ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px;">
            <sc-for list="{{k.documentos}}" as="d" hint-placeholder-count="3"><li><a href="{{d.link}}" target="{{d.alvo}}" rel="noopener noreferrer" style="text-underline-offset: 3px; line-height: 1.45;">{{d.titulo}}</a></li></sc-for>
          </ol>
        </section>

        <sc-if value="{{k.temTags}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; border-top: 1px solid {{c.line}}; padding-top: 18px;">
            <span style="color: {{c.muted}}; letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px;">Tags</span>
            <sc-for list="{{k.tags}}" as="t" hint-placeholder-count="3"><a href="noticias.html" onClick="{{t.ir}}" style="text-decoration: none; padding: 5px 11px; border-radius: 999px; border: 1.5px solid {{c.line}};">{{t.nome}}</a></sc-for>
          </div>
        </sc-if>
      </article>
      <a href="politicos.html#casos" style="align-self: flex-start; text-decoration: none; border: 2px solid {{c.ink}}; padding: 12px 20px; font-size: 14px;">← Todos os casos</a>
    </sc-if>
  </main>

  <footer style="background: #101010; color: #FFFAF0; border-top: 1px solid {{c.line}};">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px 40px; display: flex; flex-wrap: wrap; gap: 40px; justify-content: space-between;">
      <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
        <p style="margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;">Tempo Continuum</p>
        <p style="margin: 0; font-size: 1.4rem; line-height: 1.25; max-width: 24ch;"><span style="background: #556A2F; color: #FFFAF0; padding: 0 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone;">Conhecer o passado. Organizar o presente. Construir o futuro.</span></p>
      </div>
      <nav aria-label="Rodapé" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 40px; font-size: 14px; align-content: start;">
        <a href="noticias.html" style="text-decoration: none;">Notícias</a>
        <a href="streaming.html" style="text-decoration: none;">Streaming</a>
        <a href="ferramentas.html" style="text-decoration: none;">Recursos</a>
        <a href="cursos.html" style="text-decoration: none;">Academia</a>
        <a href="politicos.html" style="text-decoration: none;">Wiki</a>
        <a href="dossies.html" style="text-decoration: none;">Dossiês</a>
        <a href="publicacoes.html" style="text-decoration: none;">Publicações</a>
        <a href="index.html" style="text-decoration: none;">Início</a>
      </nav>
      <div style="display: flex; flex-direction: column; gap: 12px; align-content: start;">
        <p style="margin: 0; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #DDD5CA;">Siga o Tempo Continuum</p>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; font-size: 14px;">
          <a href="https://x.com/TempoContinuum" target="_blank" rel="noopener noreferrer" aria-label="Tempo Continuum no X (abre em nova aba)" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; border: 1.5px solid #FFFAF0; border-radius: 999px; padding: 8px 14px; min-height: 40px; box-sizing: border-box;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-6.4L6.4 22H3.3l7.3-8.3L2.8 2h6.4l4.4 5.9L18.9 2zm-1.1 18.1h1.7L7.3 3.8H5.5l12.3 16.3z"></path></svg>@TempoContinuum</a>
          <a href="https://www.instagram.com/tempo.continuum/" target="_blank" rel="noopener noreferrer" aria-label="Tempo Continuum no Instagram (abre em nova aba)" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; border: 1.5px solid #FFFAF0; border-radius: 999px; padding: 8px 14px; min-height: 40px; box-sizing: border-box;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4.2"></circle><circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"></circle></svg>@tempo.continuum</a>
          <a href="https://www.threads.com/@tempo.continuum" target="_blank" rel="noopener noreferrer" aria-label="Tempo Continuum no Threads (abre em nova aba)" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; border: 1.5px solid #FFFAF0; border-radius: 999px; padding: 8px 14px; min-height: 40px; box-sizing: border-box;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 11.2c-.4-2.4-2-3.7-4.3-3.7-2 0-3.4 1-4 2.6"></path><path d="M16.6 11.6c-3.6-.6-7.4.1-7.3 2.6.1 2.4 4.4 2.6 6 .6 1.2-1.5 1.2-4.2.6-5.6"></path><path d="M19.5 7.5C18.2 4.4 15.6 3 12.2 3 7 3 4 6.4 4 12s3 9 8.2 9c4.2 0 7.3-2.3 7.3-5.6 0-1.9-1-3.3-2.9-3.8"></path></svg>@tempo.continuum</a>

<script src="js/tags.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { escuro: null, menuAberto: false, status: 'carregando' };
  }
  componentDidMount() {
    var self = this, id = new URLSearchParams(window.location.search).get('id') || '';
    try {
      var v = window.localStorage.getItem('tc-tema');
      if (v === 'escuro' || v === 'claro') this.setState({ escuro: v === 'escuro' });
    } catch (e) {}
    var json = function (nome) { return fetch('dados/' + nome + '.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; }); };
    // O caso vem do índice dados/casos.json; as ligações, dos índices de notícias, dossiês, meta-dossiês e fichas
    json('casos').then(function (lista) {
      var k = (Array.isArray(lista) ? lista : []).filter(function (x) { return x && x.id === id; })[0];
      self.setState(k ? { caso: k, status: 'ok' } : { status: 'erro' });
      if (k) try { document.title = k.titulo + ' — Caso acompanhado — Tempo Continuum'; } catch (e) {}
    });
    [['noticias', 'noticias'], ['dossies', 'dossies'], ['metadossies', 'metas'], ['politicos', 'fichas']].forEach(function (x) {
      json(x[0]).then(function (lista) { var p = {}; p[x[1]] = Array.isArray(lista) ? lista : []; self.setState(p); });
    });
  }
  renderVals() {
    var self = this;
    var st = this.state || {};
    var escuro = (st.escuro !== null && st.escuro !== undefined) ? st.escuro : (this.props.tema ?? 'claro') === 'escuro';
    var c = escuro
      ? { bg: '#101010', surface: '#2F2E25', ink: '#FFFAF0', muted: '#DDD5CA', line: 'rgba(221, 213, 202, 0.3)' }
      : { bg: '#FFFAF0', surface: '#DDD5CA', ink: '#101010', muted: '#2F2E25', line: 'rgba(47, 46, 37, 0.28)' };
    var meses = ['jan.', 'fev.', 'mar.', 'abr.', 'maio', 'jun.', 'jul.', 'ago.', 'set.', 'out.', 'nov.', 'dez.'];
    var fmt = function (iso) { var p = String(iso || '').slice(0, 10).split('-'); return p.length === 3 ? Number(p[2]) + ' ' + meses[Number(p[1]) - 1] + ' ' + p[0] : ''; };
    var caminho = function (u) { u = String(u || '').trim(); return /^https?:/i.test(u) ? u : u.replace(/^\/+/, ''); };
    var chave = function (s) { return TCTags.norm(s).trim(); };
    // Partes das tags ("ICE: A nova Gestapo" ou "violência/contra indígenas"), para achar o que se liga por tag
    var partesDe = function (tags) {
      var p = {};
      (tags || []).forEach(function (t) { String(t).split('/').forEach(function (x) { var k = chave(x); if (k) p[k] = true; }); });
      return p;
    };
    var caso = st.caso;
    var k = {}, dossiesLigados = [], materias = [];
    if (caso) {
      var docs = caso.documentos || [];
      var nomesFichas = {};
      (st.fichas || []).forEach(function (f) { if (f && f.nome) nomesFichas[chave(f.nome)] = 'ficha.html?id=' + encodeURIComponent(f.id); });
      k = {
        titulo: caso.titulo, etapa: caso.etapa || '', temEtapa: !!caso.etapa,
        andamento: caso.status === 'Em andamento', julgamento: caso.status === 'Em julgamento', encerrado: caso.status === 'Encerrado',
        abertoTexto: fmt(caso.aberto), atualizadoTexto: fmt(caso.atualizado || caso.aberto), temAtualizado: !!caso.atualizado && caso.atualizado !== caso.aberto,
        paragrafos: String(caso.resumo || '').split(/\n\s*\n/).filter(Boolean),
        // "Jonathan Ross, agente do ICE": o nome antes da vírgula é comparado ao nome das fichas da Wiki
        envolvidos: (caso.envolvidos || []).map(function (e) {
          var f = nomesFichas[chave(String(e).split(',')[0])] || nomesFichas[chave(e)] || '';
          return { nome: e, ficha: f, temFicha: !!f };
        }),
        temEnvolvidos: (caso.envolvidos || []).length > 0,
        documentos: docs.map(function (d) { var l = caminho(d.link); return { titulo: d.titulo || l, link: l || '#', alvo: /^https?:/i.test(l) ? '_blank' : '_self' }; }),
        semDocumentos: docs.length === 0, docsTexto: docs.length + (docs.length === 1 ? ' documento' : ' documentos'),
        tags: (caso.tags || []).map(function (t) { return { nome: TCTags.rotulo(t), ir: function () { try { window.localStorage.setItem('tc-busca-tag', TCTags.limpa(t)); } catch (e) {} } }; }),
        temTags: (caso.tags || []).length > 0
      };
      // Caso -> dossiê: uma tag do caso com o título de um dossiê ou meta-dossiê
      var partes = partesDe(caso.tags);
      var achar = function (lista, tipo, param) {
        return (lista || []).filter(function (x) { return x && x.id && x.titulo && partes[chave(x.titulo)]; })
          .map(function (x) { return { tipo: tipo, titulo: x.titulo, href: 'dossie.html?' + param + '=' + encodeURIComponent(x.id) }; });
      };
      dossiesLigados = achar(st.dossies, 'dossiê', 'id').concat(achar(st.metas, 'meta-dossiê', 'meta'));
      // Notícia -> caso: as matérias com o título do caso entre as tags
      var tituloCaso = chave(caso.titulo);
      materias = (st.noticias || []).filter(function (n) { return n && n.id && partesDe(n.tags)[tituloCaso]; })
        .sort(function (a, b) { return String(a.data) < String(b.data) ? 1 : -1; })
        .map(function (n) { return { titulo: n.titulo, editoria: n.editoria || 'Notícia', dataTexto: fmt(n.data), href: 'materia.html?id=' + encodeURIComponent(n.id) }; });
    }
    return {
      menuAberto: !!st.menuAberto,
      menuFechado: !st.menuAberto,
      menuAbertoTxt: st.menuAberto ? 'true' : 'false',
      alternarMenu: function () { self.setState({ menuAberto: !self.state.menuAberto }); },
      fecharMenu: function () { self.setState({ menuAberto: false }); },
      c: c, escuro: escuro, claro: !escuro,
      temaTexto: escuro ? 'Claro' : 'Escuro',
      temaLabel: escuro ? 'Mudar para o tema claro' : 'Mudar para o tema escuro',
      alternarTema: function () {
        var novo = !escuro;
        self.setState({ escuro: novo });
        try { window.localStorage.setItem('tc-tema', novo ? 'escuro' : 'claro'); } catch (e) {}
      },
      carregando: st.status === 'carregando', naoEncontrado: st.status === 'erro', temCaso: st.status === 'ok' && !!caso,
      k: k, dossiesLigados: dossiesLigados, materias: materias, temMaterias: materias.length > 0
    };
  }
}
iniciarPagina(Component, {"tema": "claro"});
</script>
