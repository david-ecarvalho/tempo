# Publica o site no GitHub Pages a cada mudança no branch main.
# O site fica em site/: antes de publicar, site/scripts/publicar.py refaz os índices de dados/ e monta
# site/_site/ só com o que é público (sem o editor admin/, os scripts e a documentação).
# Requer (uma vez): Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/publicar-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Montar o site
        run: python3 site/scripts/publicar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/_site
      - id: deploy
        uses: actions/deploy-pages@v4
